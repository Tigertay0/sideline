<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Sideline TV banner</title>
  <!-- Rendered once at 320x180 into res/drawable-xhdpi/banner.png (the Google TV launcher tile). -->
  <style>
    html,body{margin:0;width:320px;height:180px;overflow:hidden;background:#0b0d13}
    .b{position:relative;width:320px;height:180px;display:flex;align-items:center;gap:16px;padding:0 26px;box-sizing:border-box;font-family:"Segoe UI",Roboto,sans-serif}
    .mark{flex:none;width:64px;height:64px;border-radius:14px;background:#ff6a1f;position:relative}
    .mark i{position:absolute;left:12px;right:12px;height:9px;border-radius:3px;background:#fff}
    .mark i:nth-child(1){top:12px} .mark i:nth-child(2){top:28px;background:#140a04;right:24px} .mark i:nth-child(3){top:44px;background:#140a04;right:32px}
    h1{margin:0;font:italic 800 40px/1 "Arial Narrow","Roboto Condensed",sans-serif;letter-spacing:.05em;color:#f5f6f8}
    h1 em{color:#ff6a1f;font-style:inherit}
    p{margin:6px 0 0;font:600 13px/1.2 "Segoe UI",sans-serif;color:#9298aa;letter-spacing:.04em}
  </style>
</head>
<body>
  <div class="b"><div class="mark"><i></i><i></i><i></i></div><div><h1>SIDE<em>LINE</em></h1><p>Fantasy over the game</p></div></div>
</body>
</html>
