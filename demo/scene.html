<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Sideline scene</title>
  <style>
    @font-face{font-family:SidelineArchivo;src:url(../src/ui/fonts/archivo.woff2) format("woff2");font-weight:100 900;font-stretch:62% 125%;font-display:swap}
    html,body{margin:0;height:100%;overflow:hidden;background:#0a1626;color:#fff;font:14px system-ui,sans-serif}
    /* a stand-in for the game picture: dark turf with yard lines, nothing that competes with the box */
    #pic{position:fixed;inset:0;background:#0d2236;background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.05) 0 2px,transparent 2px 12.5%)}
    #pic::after{content:"LIVE";position:absolute;top:2.2%;left:1.6%;background:#e11;padding:.25em .6em;border-radius:4px;font:800 .8em system-ui}
    .tile{position:absolute;box-sizing:border-box;border:2px solid #0a1626;background:#112c46;font:800 1.6em system-ui;color:rgba(255,255,255,.35);padding:.6em}
    .tile:nth-child(2){background:#2a2140}
  </style>
</head>
<body>
  <div id="pic"></div>
  <script>window.__sidelineOpenShadow = true;</script>
  <script src="../src/core/sample.js"></script>
  <script src="../src/ui/multiview.js"></script>
  <script src="../src/ui/overlay.css.js"></script>
  <script src="../src/ui/overlay.js"></script>
  <script src="scene.js"></script>
</body>
</html>
