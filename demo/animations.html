<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Sideline motion</title>
  <style>
    @font-face{font-family:SidelineArchivo;src:url(../src/ui/fonts/archivo.woff2) format("woff2");font-weight:100 900;font-stretch:62% 125%;font-display:swap}
    :root{color-scheme:dark;--bg:#0b0d13;--card:#141823;--line:rgba(255,255,255,.08);--text:#f5f6f8;--mute:#9298aa;--accent:#ff6a1f}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--text);font:500 15px/1.45 SidelineArchivo,"Segoe UI",system-ui,sans-serif}
    header{max-width:1360px;margin:0 auto;padding:36px 28px 8px}
    h1{margin:0;font:800 30px/1 SidelineArchivo,"Segoe UI",sans-serif;font-stretch:112%}
        header p{margin:8px 0 0;color:var(--mute);max-width:70ch}
    .grid{max-width:1360px;margin:0 auto;padding:20px 28px 60px;display:grid;grid-template-columns:repeat(auto-fill,minmax(427px,1fr));gap:22px}
    figure{margin:0;background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
    .frame{width:427px;height:240px;overflow:hidden;background:#0a1626;max-width:100%}
    iframe{width:1280px;height:720px;border:0;transform:scale(.3336);transform-origin:0 0;display:block}
    figcaption{padding:12px 16px 14px}
    figcaption b{display:flex;justify-content:space-between;align-items:center;font:700 15px/1 SidelineArchivo,"Segoe UI",sans-serif}
    figcaption p{margin:6px 0 0;color:var(--mute);font-size:13.5px}
    button{font:inherit;font-size:12px;color:var(--text);background:#232838;border:1px solid var(--line);border-radius:999px;padding:5px 12px;cursor:pointer}
    button:hover{background:#2c3347} button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
    /* tour: one animation at a time, full size, captioned (this is what gets recorded) */
    body.tour header,body.tour .grid{display:none}
    #tour{display:none;position:fixed;inset:0;background:#0a1626}
    body.tour #tour{display:block}
    #tour iframe{position:absolute;inset:0;width:100%;height:100%;transform:none}
    #cap{position:absolute;right:28px;top:22px;max-width:44%;text-align:right;pointer-events:none}
    #cap b{display:block;font:800 26px/1 SidelineArchivo,"Segoe UI",sans-serif;font-stretch:112%}
    #cap span{display:block;margin-top:6px;color:var(--mute);font-size:15px}
      </style>
</head>
<body>
  <header>
    <h1>Sideline motion</h1>
    <p>Every animation in the box, played by the real overlay code. Flat surfaces, orange only on small marks, no glows or particle bursts; each motion starts from something already on screen. Press Replay to restart one.</p>
  </header>
  <main class="grid" id="grid"></main>
  <div id="tour"><iframe id="tf" title="animation"></iframe><div id="cap"><b></b><span></span></div></div>
  <script>
    const SCENES = [
      ['td', 'Touchdown', 'The card grows out of the player\'s own row, the word and the +6.4 pill rise in turn, and the points roll up.', 8400],
      ['big', 'Big play', 'The ball runs a 60-yard line (ticks every 10), a trail draws behind it, and the gain rolls up as it travels.', 6800],
      ['fg', 'Field goal', 'The uprights draw on, then the kick rises through them.', 6400],
      ['bad', 'Turnover', 'A short, three-step shake of the header with the red pill, then still.', 6200],
      ['play', 'Scoring play', 'The quiet version: a plain pill and the same roll.', 5600],
      ['roll', 'Points roll + deltas', 'Digits roll up from the number they had; a small +6.4 appears beside the player, then fades. The win bar glides.', 7200],
      ['win', 'Win chance', 'The bar moves with the odds; the centre tick marks even.', 6400],
      ['tabs', 'League tabs', 'The pill slides between leagues and the numbers roll to the other matchup.', 6400],
      ['tile', 'Multiview', 'Moments land on the tile of their own game; the lineup becomes a compact strip.', 7600],
    ];
    const q = new URLSearchParams(location.search);
    const src = (id) => 'scene.html?scene=' + id + (q.get('size') ? '&size=' + q.get('size') : '');
    if (q.has('tour')) {
      document.body.classList.add('tour');
      const tf = document.getElementById('tf'), cap = document.getElementById('cap');
      let n = 0;
      const next = () => {
        const [id, name, text, len] = SCENES[n % SCENES.length];
        cap.querySelector('b').textContent = (n % SCENES.length + 1) + '. ' + name;
        cap.querySelector('span').textContent = text;
        tf.src = src(id) + '&size=L';
        n += 1;
        window.__tour = { n, id, name, len };
        setTimeout(next, len - 400);
      };
      next();
    } else {
      const grid = document.getElementById('grid');
      for (const [id, name, text] of SCENES) {
        const f = document.createElement('figure');
        f.innerHTML = '<div class="frame"><iframe loading="lazy" title=""></iframe></div><figcaption><b><span></span><button type="button">Replay</button></b><p></p></figcaption>';
        const iframe = f.querySelector('iframe');
        iframe.title = name + ' animation';
        iframe.src = src(id);
        f.querySelector('b span').textContent = name;
        f.querySelector('p').textContent = text;
        f.querySelector('button').addEventListener('click', () => { iframe.src = src(id) + '&r=' + Date.now(); });
        grid.appendChild(f);
      }
    }
  </script>
</body>
</html>
